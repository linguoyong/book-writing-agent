appId: com.writingagent.book
productName: 写作 Agent
copyright: Copyright © 2026 写作 Agent

directories:
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# 冻结后的 Python 后端（PyInstaller one-dir）。用 `pnpm build:server` 生成，
# 缺了它安装包会打不开——所以放在 extraResources 里、不加 filter 兜底。
extraResources:
  - from: ../../server/dist/book-server
    to: server-bin
  - from: ../../README.md
    to: README.md

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 写作 Agent
  uninstallDisplayName: 写作 Agent ${version}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
