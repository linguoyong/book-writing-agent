[project]
name = "book-server"
version = "0.1.0"
description = "Local writing agent backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "jieba>=0.42.1",
    "charset-normalizer>=3.4",
    "httpx>=0.28",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "deepagents>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "numpy>=2.5.4",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.9.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
# 索引/缓存/构建产物不参与检查
extend-exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
# E/F 为 pycodestyle+pyflakes 基础集；I 为 import 排序；B 为常见 bug 模式；UP 为旧语法升级
select = ["E", "F", "W", "I", "B", "UP"]
# 长行由格式化器处理，不在 lint 阶段报（E501 与 formatter 冲突）
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# common.py 是路由包的依赖再导出层：它 import 的很多名字只被其他路由模块使用，
# 在这里被判定为「未使用」是预期的。
"app/api/routes/common.py" = ["F401"]
