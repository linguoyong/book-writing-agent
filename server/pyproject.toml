[project]
name = "book-server"
version = "0.1.0"
description = "Local writing agent backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "jieba>=0.42.1",
    "charset-normalizer>=3.4",
    "httpx>=0.28",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "deepagents>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "numpy>=2.5.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
