<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
<title>写稿与审稿闭环</title>
<desc>写作 Agent 出稿、写前审批、独立审稿、问题清单、修订，未通过则回到写作，通过后写入 pass 状态。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="120" y="50" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="140" y="72" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">1　写作 Agent 出稿</text>
<text x="140" y="92" font-size="12" fill="#185FA5" dominant-baseline="central">按上下文与设定写出本章草稿</text>

<line x1="355" y1="110" x2="355" y2="128" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="120" y="134" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="140" y="156" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">2　写前审批</text>
<text x="140" y="176" font-size="12" fill="#185FA5" dominant-baseline="central">manuscript_write 出 diff，人工确认后落盘</text>

<line x1="355" y1="194" x2="355" y2="212" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="120" y="218" width="470" height="60" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="140" y="240" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">3　章节审稿</text>
<text x="140" y="260" font-size="12" fill="#0F6E56" dominant-baseline="central">独立模型：六维打分 + P0 / P1 / P2</text>

<line x1="355" y1="278" x2="355" y2="296" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="120" y="302" width="470" height="60" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="140" y="324" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">4　问题清单</text>
<text x="140" y="344" font-size="12" fill="#0F6E56" dominant-baseline="central">每条带原文引用；引用对不上就丢弃并计数</text>

<line x1="355" y1="362" x2="355" y2="380" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="120" y="386" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="140" y="408" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">5　修订</text>
<text x="140" y="428" font-size="12" fill="#185FA5" dominant-baseline="central">问题回给写作 Agent，改完再审，直到 P0 清零</text>

<line x1="355" y1="446" x2="355" y2="464" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="120" y="470" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="492" font-size="14" font-weight="500" fill="#173404" dominant-baseline="central">6　通过</text>
<text x="140" y="512" font-size="12" fill="#3B6D11" dominant-baseline="central">front-matter 记 pass；正文再改自动降为 stale</text>

<path d="M590 416 L612 416 L612 80 L596 80" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="612" y="248" text-anchor="middle" font-size="11" fill="#A32D2D" dominant-baseline="central">未通过</text>
</svg>
